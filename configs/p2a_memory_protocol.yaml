# FailMem Milestone P2a Protocol (v3.0): Minimal Failure Memory Mechanism Verification
# Strict Authenticity & Deterministic Mechanism Protocol
protocol_version: "3.0"
benchmark_phase: "P2a_v3_memory_mechanism_verification"
created_date: "2026-09-30"

environment:
  world_model: "configs/chokepoint_world.model"
  map_yaml: "configs/chokepoint_world.yaml"
  map_pgm: "configs/chokepoint_world.pgm"
  map_version: "chokepoint_world_v1"
  params_file: "configs/nav2_params.yaml"
  spawn_pose:
    x: -1.80
    y: 0.00
    z: 0.01
    yaw: 0.00
    frame_id: "map"

obstacle_channel:
  entity_name: "corridor_blockage_box"
  obstacle_sdf: "configs/chokepoint_box.sdf"
  pose:
    x: 0.00
    y: 0.00
    z: 0.30
  doorway_bbox:
    x_min: -0.30
    x_max: 0.30
    y_min: -0.35
    y_max: 0.35

navigation_task:
  goal_pose:
    x: 1.80
    y: 0.00
    yaw: 0.00
    frame_id: "map"
  target_region: "room2_corridor_chokepoint"
  action_sim_timeout_sec: 18.0
  action_wall_watchdog_sec: 45.0
  episode_total_sim_budget_sec: 75.0
  max_retries_per_episode: 5      # 1 initial attempt + max 5 retries = max 6 dispatches
  observation_period_sim_sec: 2.0 # Fixed cadence for observation & memory gate polling

environment_sequences:
  S1:
    name: "continuous_blockage"
    description: "Obstacle spawned at t=0 and remains in doorway for entire episode (no clearance)."
    obstacle_spawn_sim_time_sec: 0.0
    obstacle_clear_elapsed_sim_sec: null
  S2:
    name: "timed_clearance_t25"
    description: "Obstacle spawned at t=0 and deleted by independent environment timeline controller at elapsed_sim=25.0s."
    obstacle_spawn_sim_time_sec: 0.0
    obstacle_clear_elapsed_sim_sec: 25.0

memory_policies:
  M0:
    name: "no_memory"
    description: "Zero memory; repeatedly attempts failed target until episode budget exhaustion."
    class: "M0NoMemoryPolicy"
  M1:
    name: "persistent_memory"
    description: "Persistent failure memory; permanently suppresses repeat dispatch to failed target/region without invalidation."
    class: "M1PersistentMemoryPolicy"
  M2:
    name: "conditional_memory"
    description: "FailMem conditional failure memory; suppresses repeats while precondition unmet, invalidates on verified perception (doorway FREE), verifies recovery on physical arrival."
    class: "M2ConditionalMemoryPolicy"

formal_suite:
  episodes_per_condition: 3
  total_conditions: 6  # 3 policies (M0, M1, M2) x 2 sequences (S1, S2)
  total_episodes: 18

scoring_thresholds:
  position_tolerance_m: 0.30
  yaw_tolerance_rad: 0.35
  max_linear_velocity_mps: 0.05
  max_angular_velocity_radps: 0.08
  stability_window_duration_sim_sec: 2.0
  max_gt_displacement_m: 0.03
  max_sensor_staleness_sim_sec: 0.50
  max_costmap_staleness_sec: 3.00
  max_stationary_amcl_staleness_sec: 30.0
